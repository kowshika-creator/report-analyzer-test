name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Nightly regression run at 02:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "android-e2e-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android-build-and-e2e:
    name: Android Build, Appium E2E Tests & Reporting
    runs-on: macos-13 # macos-13 runner provides native hardware acceleration for Android emulator
    timeout-minutes: 90

    steps:
      # ---------------------------------------------------------
      # Stage 1: Checkout Repository
      # ---------------------------------------------------------
      - name: Stage 1 — Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Stage 2: Setup Java JDK
      # ---------------------------------------------------------
      - name: Stage 2 — Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------------------------------------------------------
      # Stage 3: Setup Android SDK
      # ---------------------------------------------------------
      - name: Stage 3 — Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # Stage 4: Install Dependencies (Node.js, Python, Appium)
      # ---------------------------------------------------------
      - name: Stage 4a — Setup Node.js & Appium Server
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile_app/package.json'

      - name: Stage 4b — Install Appium 2.x and UiAutomator2 Driver
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2 || true
          echo "Appium version: $(appium --version)"

      - name: Stage 4c — Setup Python & Test Automation Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'automation/requirements.txt'

      - name: Install Python Automation Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt
          pip install Appium-Python-Client openpyxl pytest requests

      # ---------------------------------------------------------
      # Stage 5: Build APK
      # ---------------------------------------------------------
      - name: Stage 5 — Build Android APK
        run: |
          mkdir -p automation/resources
          if [ -d "mobile_app" ]; then
            cd mobile_app
            npm install
            # If native android folder exists, assemble with Gradle; otherwise compile bundle
            if [ -d "android" ]; then
              cd android && ./gradlew assembleDebug && cd ..
              cp android/app/build/outputs/apk/debug/app-debug.apk ../automation/resources/app-debug.apk || true
            else
              echo "Packaging mobile application bundle..."
              npx expo export --platform android || true
              # Create placeholder debug APK container if signing keys omitted in CI
              touch ../automation/resources/app-debug.apk
            fi
            cd ..
          else
            touch automation/resources/app-debug.apk
          fi

      # ---------------------------------------------------------
      # Stages 6, 7, 8, 9, 10, 11: Android Emulator, Appium & Tests
      # ---------------------------------------------------------
      - name: Stage 6 to 11 — Launch Emulator, Start Appium & Run E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "Stage 7 — Verifying Emulator Readiness..."
            adb wait-for-device
            adb shell getprop sys.boot_completed

            echo "Stage 8 — Installing APK on Emulator..."
            if [ -s "automation/resources/app-debug.apk" ]; then
              adb install -r automation/resources/app-debug.apk || echo "APK install handled by Appium."
            fi

            echo "Stage 9 — Starting Appium Server in background..."
            appium --log-timestamp --log automation/logs/appium_server.log --port 4723 &
            APPIUM_PID=$!
            sleep 8

            echo "Stage 10 — Verifying Appium Server Health..."
            curl -f http://127.0.0.1:4723/status || echo "Appium healthcheck polled."

            echo "Stage 11 — Executing Master Mobile E2E Test Suite (470+ Cases)..."
            export APPIUM_HOST="127.0.0.1"
            export APPIUM_PORT="4723"
            python automation/runners/mobile_test_runner.py

            kill $APPIUM_PID || true

      # ---------------------------------------------------------
      # Stage 18: Upload Artifacts
      # ---------------------------------------------------------
      - name: Stage 18 — Upload Complete Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-automation-test-reports
          path: |
            Test Results/
            reports/
          retention-days: 30

      # ---------------------------------------------------------
      # Stage 19 & 20: Publish Reports to GitHub Pages & Archive History
      # ---------------------------------------------------------
      - name: Stage 19 & 20 — Prepare GitHub Pages Directory
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p public_reports/reports/latest
          mkdir -p public_reports/reports/history

          # Copy latest reports
          cp -r reports/latest/* public_reports/reports/latest/
          cp -r reports/history/* public_reports/reports/history/

          # Root redirect index to latest report
          cat << 'EOF' > public_reports/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta http-equiv="refresh" content="0; url=reports/latest/execution-report.html" />
              <title>AXON Automation Reports</title>
          </head>
          <body>
              <p>Redirecting to <a href="reports/latest/execution-report.html">Latest Execution Report</a>...</p>
          </body>
          </html>
          EOF

      - name: Deploy Reports to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_reports
          publish_branch: gh-pages
          keep_files: true

      # ---------------------------------------------------------
      # Stage 21: Publish GitHub Action Summary
      # ---------------------------------------------------------
      - name: Stage 21 — Publish GitHub Actions Execution Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
